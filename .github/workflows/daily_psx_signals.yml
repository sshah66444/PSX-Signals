name: PSX Telegram Commands
on:
  schedule:
    # Pakistan is UTC+5 year-round. GitHub cron is UTC-only (a `timezone:` key is
    # NOT honoured, causing runs to trigger at written UTC times in the middle of the night).
    # 14:41 UTC = 19:41 PKT
    # 16:17 UTC = 21:17 PKT
    - cron: '41 14 * * 1-5'
    - cron: '17 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psx-telegram-commands
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Handle Telegram commands only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PSX_DESK_CHAT_ID: ${{ secrets.PSX_DESK_CHAT_ID }}
          PSX_TOPIC_DESK: ${{ secrets.PSX_TOPIC_DESK }}
          PSX_TOPIC_SIGNALS: ${{ secrets.PSX_TOPIC_SIGNALS }}
          PSX_TOPIC_EVENTS: ${{ secrets.PSX_TOPIC_EVENTS }}
          PSX_TOPIC_RISK: ${{ secrets.PSX_TOPIC_RISK }}
          PSX_BOT_TOKEN_SIGNALS: ${{ secrets.PSX_BOT_TOKEN_SIGNALS }}
          PSX_BOT_TOKEN_EVENTS: ${{ secrets.PSX_BOT_TOKEN_EVENTS }}
          PSX_BOT_TOKEN_RISK: ${{ secrets.PSX_BOT_TOKEN_RISK }}
          PSX_CROSS_BOT_REPLIES: ${{ secrets.PSX_CROSS_BOT_REPLIES }}
        run: python telegram_notifier.py --check-commands
      - name: Persist legacy command ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.db
          if ! git diff --staged --quiet; then
            git commit -m "Persist PSX command ledger [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
