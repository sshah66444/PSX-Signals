name: PSX Daily Telegram Signals

on:
  schedule:
    # Runs Monday through Friday at 14:30 UTC (7:30 PM Pakistan Time)
    # when Yahoo Finance has ingested and settled PSX closing market candles
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI or mobile app

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Interactive Commands & Run PSX Daily Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Process any pending interactive user commands first
          python telegram_notifier.py --check-commands
          # Execute daily market scan and lifecycle audit
          python telegram_notifier.py

      - name: Persist Signal Ledger (signals.db)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.db
          git diff --staged --quiet || (git commit -m "Update persistent signal ledger [skip ci]" && git push)
