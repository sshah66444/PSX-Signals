name: PSX Telegram Commands
on:
  schedule:
    # Preserve the old command-polling windows without running its stale daily scan.
    - cron: '41 14 * * 1-5'
    - cron: '17 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psx-telegram-commands
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Handle Telegram commands only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notifier.py --check-commands
      - name: Persist legacy command ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.db
          if ! git diff --staged --quiet; then
            git commit -m "Persist PSX command ledger [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
