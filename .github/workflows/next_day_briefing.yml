name: PSX Next-Trading-Day Briefing
on:
  schedule:
    # GitHub interprets each cron in the explicit Pakistan timezone.
    - cron: '5,35 19 * * 1-5'
      timezone: 'Asia/Karachi'
    # Target just after 20:00 PKT, off the high-load top of the hour.
    - cron: '2,17,32,47,57 20 * * 1-5'
      timezone: 'Asia/Karachi'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psx-next-day-briefing
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log scheduler time in Pakistan
        run: python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print('Workflow started at', datetime.now(ZoneInfo('Asia/Karachi')).isoformat())"
      - name: Unlock delivery journal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python state_crypto.py decrypt
      - name: Prepare or deliver next-session plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_briefing.py --tick
      - name: Lock delivery journal
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python state_crypto.py encrypt
      - name: Record official prices for broker scorecard
        if: always()
        continue-on-error: true
        run: python broker_scorecard.py --record-session
      - name: Persist delivery journal
        if: always()
        run: |
          if [ -f .state/briefing.sqlite3.enc ] || [ -f broker_prices.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [ -f .state/briefing.sqlite3.enc ]; then git add -f .state/briefing.sqlite3.enc; fi
            if [ -f broker_prices.csv ]; then git add broker_prices.csv; fi
            if ! git diff --staged --quiet; then
              git commit -m "Persist PSX briefing delivery state [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
