name: PSX Next-Trading-Day Briefing
on:
  schedule:
    # Warm the official monthly caches at 19:05 and 19:35 Pakistan time.
    - cron: '5,35 14 * * 1-5'
    # Target 20:00 PKT; retry at 20:20, 20:40 and 20:55 if delivery/data failed.
    - cron: '0,20,40,55 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psx-next-day-briefing
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore official price cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: psx-official-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: psx-official-v1-
      - name: Prepare or deliver next-session plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_briefing.py --tick
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: psx-official-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Persist delivery journal
        if: always()
        run: |
          if [ -f .state/briefing.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f .state/briefing.sqlite3
            if ! git diff --staged --quiet; then
              git commit -m "Persist PSX briefing delivery state [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
