name: PSX Next-Trading-Day Briefing
on:
  schedule:
    # Pakistan is UTC+5 year-round. Use UTC explicitly because live runs with
    # timezone: Asia/Karachi have fired at the written UTC hour instead.
    # 14:08/14:38 UTC = 19:08/19:38 PKT: prepare the data on off-grid minutes.
    - cron: '8,38 14 * * 1-5'
    # 15:04, 15:18, 15:34, 15:48 UTC = 20:04, 20:18, 20:34, 20:48 PKT: deliver within the evening window.
    - cron: '4,18,34,48 15 * * 1-5'
    # 16:04, 16:18 UTC = 21:04, 21:18 PKT: post-cutoff closeout checkpoint on the same evening.
    - cron: '4,18 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psx-next-day-briefing
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log scheduler time in Pakistan
        run: python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print('Workflow started at', datetime.now(ZoneInfo('Asia/Karachi')).isoformat())"
      - name: Unlock delivery journal
        id: unlock_journal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python state_crypto.py decrypt
      - name: Scrape official PSX market snapshot
        continue-on-error: true
        run: python psx_snapshot.py
      - name: Prepare or deliver next-session plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_briefing.py --tick
      - name: Record completed prices for delivered-signal scorecard
        if: ${{ always() && steps.unlock_journal.outcome == 'success' }}
        continue-on-error: true
        run: python briefing_performance.py --record
      - name: Print delivered-signal scorecard
        if: ${{ always() && steps.unlock_journal.outcome == 'success' }}
        continue-on-error: true
        run: python briefing_performance.py --forward-report
      - name: Lock delivery journal
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python state_crypto.py encrypt
      - name: Record official prices for broker scorecard
        if: always()
        continue-on-error: true
        run: python broker_scorecard.py --record-session
      - name: Persist delivery journal
        if: always()
        run: |
          if [ -f .state/briefing.sqlite3.enc ] || [ -f broker_prices.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if [ -f .state/briefing.sqlite3.enc ]; then git add -f .state/briefing.sqlite3.enc; fi
            if [ -f broker_prices.csv ]; then git add broker_prices.csv; fi
            if ! git diff --staged --quiet; then
              git commit -m "Persist PSX briefing delivery state [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
