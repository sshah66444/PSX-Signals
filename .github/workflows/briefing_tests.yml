name: Next-day briefing tests
on:
  push:
    paths: ['**.py', 'briefing_config.json', 'requirements.txt', '.github/workflows/briefing_tests.yml']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_briefing
