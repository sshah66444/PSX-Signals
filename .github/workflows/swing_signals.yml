name: PSX Swing Signals (Daily Scan)

# Delivers the swing-trading signal cards to Telegram once per trading day.
# This replaces the "legacy daily scan" that was removed from
# daily_psx_signals.yml (commit ae99113), which left the bot polling commands
# but never actually scanning for new swing setups.

on:
  schedule:
    # Pakistan is UTC+5 year-round. GitHub cron is UTC-only (a `timezone:` key is
    # NOT honoured), so the windows below are written in UTC on off-peak minutes:
    #   15:52 UTC = 20:52 PKT  -> primary run, after the PSX EOD settlement window
    #   16:52 UTC = 21:52 PKT  -> retry, skipped when the primary run already delivered
    - cron: '52 15 * * 1-5'
    - cron: '52 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psx-swing-scan
  cancel-in-progress: false

jobs:
  swing_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check whether today's scan already delivered
        id: gate
        run: |
          SESSION=$(python -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; now = datetime.now(ZoneInfo('Asia/Karachi')); print(((now - timedelta(days=1)).date() if now.hour < 17 else now.date()).isoformat())")
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"
          echo "Evaluating PSX market session: ${SESSION}"
          if [ -f ".state/swing_scan_${SESSION}.done" ] && [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Swing scan already delivered for session ${SESSION}; skipping this retry window."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape official PSX market snapshot
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python psx_snapshot.py

      - name: Deliver swing-trading scan to Telegram
        if: steps.gate.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PSX_DESK_CHAT_ID: ${{ secrets.PSX_DESK_CHAT_ID }}
          PSX_TOPIC_DESK: ${{ secrets.PSX_TOPIC_DESK }}
          PSX_TOPIC_SIGNALS: ${{ secrets.PSX_TOPIC_SIGNALS }}
          PSX_TOPIC_EVENTS: ${{ secrets.PSX_TOPIC_EVENTS }}
          PSX_TOPIC_RISK: ${{ secrets.PSX_TOPIC_RISK }}
          PSX_BOT_TOKEN_SIGNALS: ${{ secrets.PSX_BOT_TOKEN_SIGNALS }}
          PSX_BOT_TOKEN_EVENTS: ${{ secrets.PSX_BOT_TOKEN_EVENTS }}
          PSX_BOT_TOKEN_RISK: ${{ secrets.PSX_BOT_TOKEN_RISK }}
          PSX_CROSS_BOT_REPLIES: ${{ secrets.PSX_CROSS_BOT_REPLIES }}
          PSX_TRADING_MODE: swing_trade
        run: python telegram_notifier.py --mode swing_trade

      - name: Verify delivery status
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -f ".state/swing_scan_${{ steps.gate.outputs.session }}.done" ]; then
            echo "Session ${{ steps.gate.outputs.session }} successfully delivered."
          else
            echo "Session ${{ steps.gate.outputs.session }} deferred (pending settlement); retry window will re-evaluate."
          fi

      - name: Persist signal ledger and delivery marker
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.db .state
          if git diff --staged --quiet; then
            echo "Nothing to persist."
            exit 0
          fi
          git commit -m "Persist PSX swing scan ledger [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not push the updated signal ledger after 3 attempts."
          exit 1
